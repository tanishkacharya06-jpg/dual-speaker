name: Build FamilyGuard APK
on:
  push:
    branches: [familyguard-build]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'
      - name: Extract FamilyGuard project
        run: unzip -o FamilyGuard.zip -d .
      - name: Build installable release APK
        run: gradle assembleRelease
        working-directory: FamilyGuard
      - uses: actions/upload-artifact@v4
        with:
          name: FamilyGuard-apk
          path: FamilyGuard/app/build/outputs/apk/release/*.apk
          if-no-files-found: error

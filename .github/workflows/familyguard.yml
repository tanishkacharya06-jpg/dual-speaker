name: Build FamilyGuard APK
on:
  push:
    branches: [familyguard-build]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'
      - name: Extract FamilyGuard project
        run: unzip -o FamilyGuard.zip -d .
      - name: Fix Kotlin recursive type inference in admin setup
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path("FamilyGuard/app/src/main/java/com/family/guard/AdminActivity.kt")
          source = path.read_text()
          old = '''    private fun setup() = Ui.passDialog(this, "Create admin passcode (min 4 characters)", {
                  if (it.length >= 4) { Store.setAdminPass(this, it); enter() }
                  else { Ui.toast(this, "Too short"); setup() }
              }, { finish() })
          '''
          new = '''    private fun setup(): Unit {
                  Ui.passDialog(this, "Create admin passcode (min 4 characters)", {
                      if (it.length >= 4) { Store.setAdminPass(this, it); enter() }
                      else { Ui.toast(this, "Too short"); setup() }
                  }, { finish() })
              }
          '''
          if old not in source:
              raise SystemExit("Expected recursive setup() function was not found; refusing to patch a different source.")
          path.write_text(source.replace(old, new, 1))
          PY
      - name: Build installable release APK
        run: gradle assembleRelease --stacktrace
        working-directory: FamilyGuard
      - uses: actions/upload-artifact@v4
        with:
          name: FamilyGuard-apk
          path: FamilyGuard/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
